name: Windows CI/CD (MyGo)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Tests & Vet
        run: |
          go vet ./...
          go test ./...

      - name: Build Windows Executable
        id: build
        run: |
          $now = (Get-Date).AddHours(8).ToString("yyyy-MM-dd HH:mm:ss")
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v")) {
            $tag = "v0.9.0+105"
          }
          $cleanVer = $tag.TrimStart("v")
          $verParts = $cleanVer.Split("+")
          $ver = $verParts[0]
          $buildNum = if ($verParts.Length -gt 1) { $verParts[1] } else { "105" }

          # 同步版本号到 mygo.json（用于 Windows PE 版本信息）和 internal/version
          $cfg = Get-Content mygo.json -Raw | ConvertFrom-Json
          $cfg.version = $ver
          $cfg | ConvertTo-Json -Depth 10 | Set-Content mygo.json -Encoding UTF8

          $env:CGO_ENABLED = "0"
          $env:GOFLAGS = "-tags=mygo_nowebview"
          go tool mygo build -platform windows/amd64 -skip-installer -o dist

          $zipName = "carrydock-v${ver}+${buildNum}.zip"
          Compress-Archive -Path dist/windows-amd64/CarryDock.exe -DestinationPath $zipName -Force
          echo "zip_file=$zipName" >> $env:GITHUB_OUTPUT
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "build_num=$buildNum" >> $env:GITHUB_OUTPUT
          echo "build_time=$now" >> $env:GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: carrydock-windows
          path: ${{ steps.build.outputs.zip_file }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ${{ steps.build.outputs.zip_file }}
          body: |
            CarryDock Windows Release (MyGo Native UI)
            - Version: ${{ steps.build.outputs.version }}+${{ steps.build.outputs.build_num }}
            - Build Time: ${{ steps.build.outputs.build_time }}
